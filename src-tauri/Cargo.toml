[package]
name = "rt-pn"
version = "0.2.3"
description = "RT-PN native workbench"
authors = ["kevindadi"]
edition = "2021"
license = "MIT"

[lib]
name = "rt_pn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"

